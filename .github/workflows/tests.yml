name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # pytest is the only thing installed. This project is standard-library
      # only, so anything else appearing here would be a regression.
      - run: pip install pytest

      - run: python -m pytest -q
